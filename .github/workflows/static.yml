name: Deploy YARA LUDO ONDO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - run: npm cache clean --force
      - run: rm -rf package-lock.json node_modules
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - name: Find built files
        run: |
          ls -la
          ls -la .output || true
          ls -la .output/public || true
          find .output -name "index.html" -type f | head -20 || true
          find dist -name "index.html" -type f | head -20 || true
      - uses: actions/configure-pages@v4
      - name: Upload artifact - try .output/public first
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
