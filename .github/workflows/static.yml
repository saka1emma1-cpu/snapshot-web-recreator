name: Deploy YARA LUDO ONDO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - run: npm cache clean --force
      - run: rm -rf package-lock.json node_modules
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - name: Create index.html for GitHub Pages
        run: |
          ls -la .output/public/
          CLIENT=$(ls .output/public/assets/client-*.js 2>/dev/null | head -1 | xargs -n1 basename)
          echo "Found client: $CLIENT"
          cat > .output/public/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>YARA LUDO ONDO</title>
            <base href="/snapshot-web-recreator/" />
          </head>
          <body>
            <div id="root"></div>
            <script type="module">
              import "/snapshot-web-recreator/assets/${CLIENT}"
            </script>
          </body>
          </html>
          EOF
          cat .output/public/index.html
          ls -la .output/public/
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
